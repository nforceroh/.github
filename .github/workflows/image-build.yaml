name: image-build

# Reusable image build/publish workflow for the homelab container image repos.
#
# Callers look like:
#
#   jobs:
#     image:
#       uses: nforceroh/.github/.github/workflows/image-build.yaml@v1
#       permissions: { contents: read, packages: write, attestations: write, id-token: write }
#
# The caller must grant `packages: write` (plus `attestations`/`id-token` for
# provenance) — a called workflow cannot elevate the token it receives.

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name. Defaults to the caller's repository name.
        type: string
        required: false
        default: ""
      context:
        description: Build context path.
        type: string
        required: false
        default: "."
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        type: string
        required: false
        default: "Dockerfile"
      test-command:
        description: >
          Command run after a local build to smoke test the image. Receives the
          locally built image reference in IMAGE. Set to empty to skip.
        type: string
        required: false
        default: './tests/run_tests.sh "$IMAGE"'
      platforms:
        description: Target platforms for the published image.
        type: string
        required: false
        default: "linux/amd64"
      registry:
        description: Container registry host.
        type: string
        required: false
        default: "ghcr.io"
      registry-owner:
        description: Registry namespace. Defaults to the calling repository owner.
        type: string
        required: false
        default: ""
      extra-tags:
        description: Comma separated literal tags to publish in addition to the defaults.
        type: string
        required: false
        default: ""
      publish-base-digest:
        description: >
          Also tag the image with "<base-tag>-<base-digest>" resolved from the
          Dockerfile's first FROM line. Used by the base image itself so
          downstream repos can pin a specific Alpine snapshot.
        type: boolean
        required: false
        default: false
      provenance:
        description: Emit a build provenance attestation.
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image metadata
        id: vars
        run: |
          set -euo pipefail

          NAME="${{ inputs.image-name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REPOSITORY##*/}"; fi

          OWNER="${{ inputs.registry-owner }}"
          if [ -z "$OWNER" ]; then OWNER="${GITHUB_REPOSITORY_OWNER}"; fi

          BUILD_DATE="$(date -u +'%Y%m%d%H%M%S')"

          {
            echo "name=${NAME}"
            echo "base=${{ inputs.registry }}/${OWNER}/${NAME}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image: ${{ inputs.registry }}/${OWNER}/${NAME}"

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ inputs.registry }}
        # Needed before the test build when FROM references a moving tag such as
        # :latest; buildx resolves it during the build, not at push time.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: local/${{ steps.vars.outputs.name }}:ci
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            VERSION=${{ steps.vars.outputs.build_date }}

      - name: Smoke test
        if: inputs.test-command != ''
        env:
          IMAGE: local/${{ steps.vars.outputs.name }}:ci
        run: ${{ inputs.test-command }}

      - name: Resolve extra tags
        id: extra
        run: |
          set -euo pipefail
          OUT="$(mktemp)"

          if [ -n "${{ inputs.extra-tags }}" ]; then
            IFS=',' read -ra PARTS <<< "${{ inputs.extra-tags }}"
            for TAG in "${PARTS[@]}"; do
              TAG="$(echo "$TAG" | xargs)"
              if [ -n "$TAG" ]; then printf 'type=raw,value=%s\n' "$TAG" >> "$OUT"; fi
            done
          fi

          if [ "${{ inputs.publish-base-digest }}" = "true" ]; then
            BASE_REF="$(awk 'tolower($1)=="from"{print $2; exit}' '${{ inputs.dockerfile }}')"
            if [ -z "${BASE_REF}" ]; then
              echo "::error::Could not read a FROM line from ${{ inputs.dockerfile }}"
              exit 1
            fi
            BASE_TAG="${BASE_REF##*:}"
            case "${BASE_TAG}" in */*) BASE_TAG="${BASE_REF##*/}" ;; esac
            DIGEST="$(docker buildx imagetools inspect "${BASE_REF}" | awk '/^Digest:/{print $2; exit}')"
            if [ -z "${DIGEST}" ]; then
              echo "::error::Could not resolve digest for ${BASE_REF}"
              exit 1
            fi
            SHORT="${DIGEST#sha256:}"
            SHORT="${SHORT:0:12}"
            printf 'type=raw,value=%s-%s\n' "${BASE_TAG}" "${SHORT}" >> "$OUT"
            echo "Base ${BASE_REF} resolves to ${DIGEST}"
          fi

          {
            echo "tags<<IMAGE_BUILD_EXTRA_TAGS_EOF"
            cat "$OUT"
            echo "IMAGE_BUILD_EXTRA_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.base }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.vars.outputs.build_date }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            ${{ steps.extra.outputs.tags }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            VERSION=${{ steps.vars.outputs.build_date }}

      - name: Attest build provenance
        if: inputs.provenance && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.base }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published \`${{ steps.vars.outputs.base }}\`"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| build date | \`${{ steps.vars.outputs.build_date }}\` |"
            echo
            echo "**Tags**"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
