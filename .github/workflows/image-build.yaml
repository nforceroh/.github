name: image-build

# Reusable image build/publish workflow for the homelab container image repos.
#
# Callers look like:
#
#   jobs:
#     image:
#       uses: nforceroh/.github/.github/workflows/image-build.yaml@v1
#       permissions: { contents: read, packages: write, attestations: write, id-token: write }
#
# The caller must grant `packages: write` (plus `attestations`/`id-token` for
# provenance) — a called workflow cannot elevate the token it receives.

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name. Defaults to the caller's repository name.
        type: string
        required: false
        default: ""
      context:
        description: Build context path.
        type: string
        required: false
        default: "."
      dockerfile:
        description: Dockerfile path, relative to the repository root.
        type: string
        required: false
        default: "Dockerfile"
      setup-test-command:
        description: >
          Command run on the runner before the smoke test, for suites that need
          host-side tooling (e.g. installing Python dependencies). Set to empty
          to skip.
        type: string
        required: false
        default: ""
      test-command:
        description: >
          Command run after a local build to smoke test the image. Receives the
          locally built image reference in IMAGE. Set to empty to skip.
        type: string
        required: false
        default: './tests/run_tests.sh "$IMAGE"'
      platforms:
        description: Target platforms for the published image.
        type: string
        required: false
        default: "linux/amd64"
      registry:
        description: Container registry host.
        type: string
        required: false
        default: "ghcr.io"
      registry-owner:
        description: Registry namespace. Defaults to the calling repository owner.
        type: string
        required: false
        default: ""
      extra-tags:
        description: Comma separated literal tags to publish in addition to the defaults.
        type: string
        required: false
        default: ""
      extra-build-args:
        description: >
          Newline separated extra build args, one KEY=value per line. The
          shared BUILD_DATE and VERSION are always supplied.
        type: string
        required: false
        default: ""
      publish-base-digest:
        description: >
          Also tag the image with "<base-tag>-<base-digest>" resolved from the
          Dockerfile's first FROM line. Used by the base image itself so
          downstream repos can pin a specific Alpine snapshot.
        type: boolean
        required: false
        default: false
      provenance:
        description: Emit a build provenance attestation.
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image metadata
        id: vars
        env:
          INPUT_IMAGE_NAME: ${{ inputs.image-name }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_REGISTRY_OWNER: ${{ inputs.registry-owner }}
          INPUT_EXTRA_BUILD_ARGS: ${{ inputs.extra-build-args }}
        run: |
          set -euo pipefail

          NAME="${INPUT_IMAGE_NAME}"
          if [ -z "${NAME}" ]; then NAME="${GITHUB_REPOSITORY##*/}"; fi

          OWNER="${INPUT_REGISTRY_OWNER}"
          if [ -z "${OWNER}" ]; then OWNER="${GITHUB_REPOSITORY_OWNER}"; fi

          BUILD_DATE="$(date -u +'%Y%m%d%H%M%S')"
          BASE="${INPUT_REGISTRY}/${OWNER}/${NAME}"

          {
            echo "name=${NAME}"
            echo "base=${BASE}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved image: ${BASE}"

      - name: Set up QEMU
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ inputs.registry }}
        # Must precede the steps below that touch the registry: resolving the
        # base image digest, and the test build when FROM uses a moving tag
        # such as :latest (buildx resolves that during the build).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build args
        id: args
        env:
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_EXTRA_BUILD_ARGS: ${{ inputs.extra-build-args }}
        run: |
          set -euo pipefail

          # A Dockerfile that declares BUILD_DATE/VERSION with an "unknown"
          # default otherwise resolves to that default and the published image
          # loses its metadata. Supply them, plus VCS_REF and the digest of the
          # base image the Dockerfile builds from.
          BASE_REF="$(awk 'tolower($1)=="from"{print $2; exit}' "${INPUT_DOCKERFILE}")"
          BASE_DIGEST="unknown"
          if [ -n "${BASE_REF}" ]; then
            # Preferred: buildx prints just the digest. Fall back to parsing the
            # human-readable form, whose key padding varies between versions.
            if RESOLVED="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${BASE_REF}" 2>/dev/null)" \
               && [ -n "${RESOLVED}" ]; then
              BASE_DIGEST="${RESOLVED}"
            elif RESOLVED="$(docker buildx imagetools inspect "${BASE_REF}" 2>&1 \
                              | awk -F': *' 'tolower($1)=="digest"{print $2; exit}')" \
                 && [ -n "${RESOLVED}" ]; then
              BASE_DIGEST="${RESOLVED}"
            else
              # Non-fatal: only the digest-suffixed tag depends on this.
              echo "::warning::Could not resolve a digest for ${BASE_REF}; continuing without it"
              docker buildx imagetools inspect "${BASE_REF}" 2>&1 | sed 's/^/  /' || true
            fi
          fi

          {
            echo "build_args<<IMAGE_BUILD_ARGS_EOF"
            printf 'BUILD_DATE=%s\n' "${{ steps.vars.outputs.build_date }}"
            printf 'VERSION=%s\n' "${{ steps.vars.outputs.build_date }}"
            printf 'VCS_REF=%s\n' "${GITHUB_SHA}"
            printf 'BASE_DIGEST=%s\n' "${BASE_DIGEST}"
            if [ -n "${INPUT_EXTRA_BUILD_ARGS}" ]; then
              printf '%s\n' "${INPUT_EXTRA_BUILD_ARGS}"
            fi
            echo "IMAGE_BUILD_ARGS_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "base_ref=${BASE_REF}"
            echo "base_digest=${BASE_DIGEST}"
          } >> "$GITHUB_OUTPUT"

          echo "Base ${BASE_REF:-<none>} -> ${BASE_DIGEST}"

      - name: Build local image for testing
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          push: false
          tags: local/${{ steps.vars.outputs.name }}:ci
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Set up test environment
        if: inputs.setup-test-command != ''
        run: ${{ inputs.setup-test-command }}

      - name: Smoke test
        if: inputs.test-command != ''
        env:
          IMAGE: local/${{ steps.vars.outputs.name }}:ci
        run: ${{ inputs.test-command }}

      - name: Resolve extra tags
        id: extra
        env:
          INPUT_EXTRA_TAGS: ${{ inputs.extra-tags }}
          INPUT_PUBLISH_BASE_DIGEST: ${{ inputs.publish-base-digest }}
          INPUT_BASE_REF: ${{ steps.args.outputs.base_ref }}
          INPUT_BASE_DIGEST: ${{ steps.args.outputs.base_digest }}
        run: |
          set -euo pipefail
          OUT="$(mktemp)"

          if [ -n "${INPUT_EXTRA_TAGS}" ]; then
            IFS=',' read -ra PARTS <<< "${INPUT_EXTRA_TAGS}"
            for TAG in "${PARTS[@]}"; do
              TAG="$(echo "$TAG" | xargs)"
              if [ -n "$TAG" ]; then printf 'type=raw,value=%s\n' "$TAG" >> "$OUT"; fi
            done
          fi

          if [ "${INPUT_PUBLISH_BASE_DIGEST}" = "true" ]; then
            # Reuse the digest the build-args step already resolved rather than
            # calling imagetools again — it needs the registry, and a failure
            # here must not abort the build.
            BASE_REF="${INPUT_BASE_REF}"
            DIGEST="${INPUT_BASE_DIGEST}"
            if [ -z "${BASE_REF}" ] || [ "${DIGEST}" = "unknown" ] || [ -z "${DIGEST}" ]; then
              echo "::warning::No base digest available for '${BASE_REF:-<none>}'; skipping the digest-suffixed tag"
            else
              BASE_TAG="${BASE_REF##*:}"
              case "${BASE_TAG}" in */*) BASE_TAG="${BASE_REF##*/}" ;; esac
              SHORT="${DIGEST#sha256:}"
              SHORT="${SHORT:0:12}"
              printf 'type=raw,value=%s-%s\n' "${BASE_TAG}" "${SHORT}" >> "$OUT"
              echo "Base ${BASE_REF} resolves to ${DIGEST}"
            fi
          fi

          {
            echo "tags<<IMAGE_BUILD_EXTRA_TAGS_EOF"
            cat "$OUT"
            echo "IMAGE_BUILD_EXTRA_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.vars.outputs.base }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ steps.vars.outputs.build_date }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            ${{ steps.extra.outputs.tags }}

      - name: Build and push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Attest build provenance
        if: inputs.provenance && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.vars.outputs.base }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published \`${{ steps.vars.outputs.base }}\`"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| digest | \`${{ steps.push.outputs.digest }}\` |"
            echo "| build date | \`${{ steps.vars.outputs.build_date }}\` |"
            echo
            echo "**Tags**"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
